<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Learning Bitcoin from the Command Line</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="alternate icon" href="images/logos/lbtc-logo-black.png" type="image/png" />
  <!-- Open Graph & Social Media Link Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Learning Bitcoin from the Command Line">
  <meta property="og:description" content="A complete tutorial for interacting with Bitcoin and Lightning using the command line.">
  <meta property="og:image" content="https://www.blockchaincommons.com/images/projects/lbtc-screen.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Learning Bitcoin from the Command Line">
  <meta name="twitter:description" content="A complete tutorial for interacting with Bitcoin and Lightning using the command line.">
  <meta name="twitter:image" content="https://www.blockchaincommons.com/images/projects/lbtc-screen.png">

  <!-- Light & Dark Mode Stylesheets -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/docsify-themeable/style.min.css"
    type="text/css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/style.min.css"
    title="docsify-darklight-theme" type="text/css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <!-- Import JetBrains Mono Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">

  <!-- Apply JetBrains Mono to code blocks and headings -->
  <style>
    /* Apply JetBrains Mono to all code blocks and inline code */
    code,
    pre,
    kbd,
    tt {
      font-family: 'JetBrains Mono', 'Courier New', monospace !important;
    }

    /* Optional: Make headings slightly more distinct while keeping code mono */
    h1,
    h2,
    h3,
    h4,
    h5 {
      font-family: 'JetBrains Mono', 'Courier New', monospace !important;
      font-weight: 700 !important;
    }

    /* Ensure headings still look like headings (e.g., proper spacing) */
    h1 {
      font-size: 2.5em;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 2em;
      margin-top: 2rem;
      margin-bottom: 0.8rem;
    }

    /* A bit of extra spacing for code blocks to make them stand out */
    pre {
      padding: 1rem;
      border-radius: 6px;
      background-color: rgba(0, 0, 0, 0.08);
      /* Subtle background */
    }

    /* Match the existing dark/light theme styling */
    .dark pre {
      background-color: rgba(0, 0, 0, 0.2);
    }

    /* Navbar Dropdown styling (Dark Mode Default) */
    .app-nav li ul {
      background-color: #1e222b !important;
      background: #1e222b !important;
      border: 1px solid #333842 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6) !important;
      border-radius: 8px !important;
      padding: 6px 8px !important;
      min-width: 50px !important;
      text-align: center !important;
    }

    .app-nav li ul li {
      margin: 4px 0 !important;
      background: transparent !important;
    }

    .app-nav li ul li a {
      color: #ffffff !important;
      font-size: 1.25rem !important;
      font-weight: bold !important;
      padding: 6px 10px !important;
      border-radius: 6px !important;
      display: block !important;
      text-decoration: none !important;
      background: transparent !important;
    }

    .app-nav li ul li a:hover {
      background-color: rgba(247, 147, 26, 0.25) !important;
      color: #ffffff !important;
    }

    /* Light Mode Dropdown Styling Override */
    body.light .app-nav li ul,
    body[data-theme="light"] .app-nav li ul {
      background-color: #ffffff !important;
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15) !important;
    }

    body.light .app-nav li ul li a,
    body[data-theme="light"] .app-nav li ul li a {
      color: #1e293b !important;
    }

    /* Pin navbar to top-right corner when scrolling (like Octocat) */
    .app-nav {
      position: fixed !important;
      top: 25px !important;
      right: 80px !important;
      z-index: 99 !important;
      display: flex !important;
      align-items: center !important;
    }

    .app-nav > ul {
      display: flex !important;
      align-items: center !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Modern Theme Toggle inside Navbar */
    #docsify-darklight-theme {
      position: relative !important;
      top: auto !important;
      right: auto !important;
      left: auto !important;
      bottom: auto !important;
      width: 32px !important;
      height: 32px !important;
      margin: 0 8px 0 0 !important;
      border-radius: 50% !important;
      background: rgba(247, 147, 26, 0.12) !important;
      border: 1px solid rgba(247, 147, 26, 0.35) !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
      cursor: pointer !important;
      box-sizing: border-box !important;
    }

    #docsify-darklight-theme:hover {
      transform: scale(1.1) rotate(15deg) !important;
      background: rgba(247, 147, 26, 0.25) !important;
      border-color: #f7931a !important;
      box-shadow: 0 0 12px rgba(247, 147, 26, 0.4) !important;
    }

    /* Move Sidebar Toggle Button to the top of the page */
    .sidebar-toggle,
    .sidebar-toggle-button {
      top: 18px !important;
      bottom: auto !important;
      position: fixed !important;
      z-index: 101 !important;
    }

    body:not(.dark) .app-nav li ul li a:hover {
      background-color: #f7931a !important;
      color: #ffffff !important;
    }
  </style>
</head>

<body>
  <div id="app">Loading documentation...</div>
  <script>
    window.$docsify = {
      name: 'Learning Bitcoin',
      repo: 'https://github.com/BlockchainCommons/Learning-Bitcoin-from-the-Command-Line',

      // Navigation & Sidebar Config
      loadSidebar: 'sidebar.md',
      loadNavbar: 'navbar.md',
      fallbackToTop: true,
      homepage: 'README.md',
      subMaxLevel: 3,
      auto2top: true,

      // 1. Pagination Settings
      pagination: {
        previousText: '← Previous Chapter',
        nextText: 'Next Chapter →',
        crossChapter: true,        // Allow navigation across main sidebar groupings
        crossChapterText: true     // Show the name of the next markdown file
      },

      // Dark/Light Theme Settings
      darklightTheme: {
        siteFont: "Source Sans Pro, Helvetica Neue, Arial, sans-serif",
        defaultTheme: 'dark',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        bodyFontSize: '15px',
        dark: {
          accent: '#f7931a', // Bitcoin Orange
          toogleBackground: '#ffffff',
          background: '#111216',
          textColor: '#e4e7eb'
        },
        light: {
          accent: '#f7931a', // Bitcoin Orange
          toogleBackground: '#091a28',
          background: '#ffffff',
          textColor: '#2c3e50'
        }
      },

      // 2. Custom Footer Hook (Injects layout at the bottom of every page)
      plugins: [
        function (hook) {
          var footer = [
            '<hr/>',
            '<footer>',
            '  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #858585; padding: 10px 0;">',
            '    <span>🎓 Learning Bitcoin from the Command Line</span>',
            '    <span>Licensed under CC-BY-4.0 | Blockchain Commons</span>',
            '  </div>',
            '</footer>'
          ].join('');

          hook.afterEach(function (html) {
            return html + footer;
          });

          // Move Theme Toggle directly into Navbar
          hook.doneEach(function () {
            var toggle = document.querySelector('#docsify-darklight-theme');
            var navUl = document.querySelector('.app-nav > ul');
            if (toggle && navUl) {
              if (!toggle.parentElement.classList.contains('theme-toggle-wrapper')) {
                var li = document.createElement('li');
                li.className = 'theme-toggle-wrapper';
                li.style.display = 'inline-flex';
                li.style.alignItems = 'center';
                li.style.marginRight = '12px';
                li.appendChild(toggle);
                navUl.insertBefore(li, navUl.firstChild);
              }
            }
          });
        }
      ]
    }
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Light/Dark Mode Switcher JS -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/index.min.js" type="text/javascript"></script>

  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- 3. Pagination Plugin Script -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <!-- 4. Docsify CLI Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-cli/dist/docsify-cli.min.js"></script>

  <!-- 5. Docsify Tabs Plugin Script -->
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>

  <!-- 6. Docsify Copy To Clipboard -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <!-- Prism.js Language Highlighters -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>

</body>

</html>
