<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/style.min.css"

  <!-- Import JetBrains Mono Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">

  <style>
    /* Apply JetBrains Mono to code blocks and headings */
    code, pre, kbd, tt {
      font-family: 'JetBrains Mono', 'Courier New', monospace !important;
    }

    h1, h2, h3, h4, h5 {
      font-family: 'JetBrains Mono', 'Courier New', monospace !important;
      font-weight: 700 !important;
    }

    h1 {
      font-size: 2.5em;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }

    h2 {
      font-size: 2em;
      margin-top: 2rem;
      margin-bottom: 0.8rem;
    }

    pre {
      padding: 1rem;
      border-radius: 6px;
      background-color: rgba(0, 0, 0, 0.08);
    }

    .dark pre {
      background-color: rgba(0, 0, 0, 0.2);
    }

    /* 1. Sidebar Toggle Button */
    .sidebar-toggle,
    .sidebar-toggle-button {
      top: 16px !important;
      bottom: auto !important;
      left: 16px !important;
      position: fixed !important;
      z-index: 101 !important;
    }

    /* 2. Theme Toggle (Positioned inside sidebar near right boundary) */
    #docsify-darklight-theme {
      position: fixed !important;
      top: 14px !important;
      left: 175px !important;
      right: auto !important;
      bottom: auto !important;
      z-index: 101 !important;
      width: 32px !important;
      height: 32px !important;
      margin: 0 !important;
      border-radius: 50% !important;
      background: transparent !important;
      border: 1px solid transparent !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      cursor: pointer !important;
      box-sizing: border-box !important;
      box-shadow: none !important;
    }

    #docsify-darklight-theme:hover {
      transform: scale(1.15) !important;
      background: rgba(247, 147, 26, 0.15) !important;
      border-color: rgba(247, 147, 26, 0.4) !important;
      box-shadow: none !important;
    }

    /* 3. Language Selector Navbar (Contained cleanly inside right sidebar boundary) */
    .app-nav {
      position: fixed !important;
      top: 14px !important;
      left: 220px !important;
      right: auto !important;
      z-index: 101 !important;
      display: flex !important;
      align-items: center !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .app-nav > ul > li {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      display: inline-flex !important;
      align-items: center !important;
      cursor: pointer !important;
    }

    .app-nav > ul > li:hover {
      transform: scale(1.15) !important;
    }

    .app-nav img {
      width: 32px !important;
      height: 22px !important;
      object-fit: cover !important;
      border-radius: 3px !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25) !important;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      display: inline-block !important;
      vertical-align: middle !important;
    }

    .app-nav img:hover {
      transform: scale(1.15) !important;
    }

    /* Hide tools when sidebar is collapsed */
    body.close #docsify-darklight-theme,
    body.close .app-nav {
      display: none !important;
    }

    .app-nav > ul {
      display: flex !important;
      align-items: center !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* 4. Search input spacing below the top toolbar controls */
    .search {
      margin-top: 55px !important;
      padding: 10px 15px !important;
    }

    /* Moon & Sun SVG Icon Styling */
    #docsify-darklight-theme svg {
      width: 18px !important;
      height: 18px !important;
      display: block !important;
      margin: 0 auto !important;
    }

    body.theme-is-light #docsify-darklight-theme svg,
    body.light #docsify-darklight-theme svg {
      stroke: #091a28 !important;
      fill: none !important;
    }

    body.theme-is-dark #docsify-darklight-theme svg,
    body.dark #docsify-darklight-theme svg {
      stroke: #f7931a !important;
      fill: none !important;
    }

    /* Navbar Dropdown Base Item Styling */
    .app-nav li ul li {
      margin: 4px 0 !important;
      background: transparent !important;
    }

    .app-nav li ul li a {
      font-size: 1.25rem !important;
      font-weight: bold !important;
      padding: 6px 10px !important;
      border-radius: 6px !important;
      display: block !important;
      text-decoration: none !important;
      background: transparent !important;
    }

    /* Dark Mode Dropdown Popup Background & Click-to-Open Display */
    .app-nav li > ul,
    .app-nav li:hover > ul {
      display: none !important;
    }

    .app-nav li.open > ul {
      display: block !important;
    }

    body.theme-is-dark .app-nav li ul,
    body.dark .app-nav li ul,
    body[data-theme="dark"] .app-nav li ul,
    body:not(.theme-is-light) .app-nav li ul {
      background-color: #1e222b !important;
      background: #1e222b !important;
      border: 1px solid #333842 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6) !important;
      border-radius: 8px !important;
      padding: 6px 8px !important;
      min-width: 50px !important;
      text-align: center !important;
      right: 0 !important;
      left: auto !important;
    }

    body.theme-is-dark .app-nav li ul li a,
    body.dark .app-nav li ul li a {
      color: #ffffff !important;
    }

    body.theme-is-dark .app-nav li ul li a:hover,
    body.dark .app-nav li ul li a:hover {
      background-color: rgba(247, 147, 26, 0.25) !important;
      color: #ffffff !important;
    }

    /* Light Mode Dropdown Popup Background */
    body.theme-is-light .app-nav li ul,
    body.light .app-nav li ul,
    body[data-theme="light"] .app-nav li ul {
      background-color: #ffffff !important;
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15) !important;
      border-radius: 8px !important;
      padding: 6px 8px !important;
      min-width: 50px !important;
      text-align: center !important;
      right: 0 !important;
      left: auto !important;
    }

    body.theme-is-light .app-nav li ul li a,
    body.light .app-nav li ul li a {
      color: #1e293b !important;
    }

    body.theme-is-light .app-nav li ul li a:hover,
    body.light .app-nav li ul li a:hover {
      background-color: rgba(247, 147, 26, 0.2) !important;
      color: #1e293b !important;
    }
  </style>
</head>

<body>
  <div id="app">Loading documentation...</div>
  <script>
    window.$docsify = {
      name: 'Learning Bitcoin',
      repo: 'https://github.com/BlockchainCommons/Learning-Bitcoin-from-the-Command-Line',

      // Navigation & Sidebar Config
      loadSidebar: 'sidebar.md',
      loadNavbar: 'navbar.md',
      fallbackToTop: true,
      homepage: 'README.md',
      subMaxLevel: 3,
      auto2top: true,

      // 1. Pagination Settings
      pagination: {
        previousText: '← Previous Chapter',
        nextText: 'Next Chapter →',
        crossChapter: true,        // Allow navigation across main sidebar groupings
        crossChapterText: true     // Show the name of the next markdown file
      },

      // Dark/Light Theme Settings
      darklightTheme: {
        siteFont: "Source Sans Pro, Helvetica Neue, Arial, sans-serif",
        defaultTheme: 'light',
        codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
        bodyFontSize: '15px',
        dark: {
          accent: '#f7931a', // Bitcoin Orange
          toogleBackground: '#ffffff',
          background: '#111216',
          textColor: '#e4e7eb'
        },
        light: {
          accent: '#f7931a', // Bitcoin Orange
          toogleBackground: '#091a28',
          background: '#ffffff',
          textColor: '#2c3e50'
        }
      },

      // 2. Custom Hooks
      plugins: [
        function (hook) {
          var footer = [
            '<hr/>',
            '<footer>',
            '  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #858585; padding: 10px 0;">',
            '    <span>🎓 Learning Bitcoin from the Command Line</span>',
            '    <span>Licensed under CC-BY-4.0 | Blockchain Commons</span>',
            '  </div>',
            '</footer>'
          ].join('');

          hook.afterEach(function (html) {
            return html + footer;
          });

          // Theme sync hook
          hook.doneEach(function () {
            var sunIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f7931a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
            var moonIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#091a28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';

            function syncThemeState() {
              var theme = localStorage.getItem('DARK_LIGHT_THEME') || 'light';
              var toggleBtn = document.querySelector('#docsify-darklight-theme');
              if (theme === 'light') {
                document.body.classList.add('theme-is-light');
                document.body.classList.remove('theme-is-dark');
                if (toggleBtn) toggleBtn.innerHTML = moonIcon;
              } else {
                document.body.classList.add('theme-is-dark');
                document.body.classList.remove('theme-is-light');
                if (toggleBtn) toggleBtn.innerHTML = sunIcon;
              }
            }

            syncThemeState();

            var toggleBtn = document.querySelector('#docsify-darklight-theme');
            if (toggleBtn) {
              toggleBtn.addEventListener('click', function () {
                setTimeout(syncThemeState, 20);
                setTimeout(syncThemeState, 150);
              });
            }
          });
        }
      ]
    }

    // Global Delegated Click Handler for Language Dropdown
    document.addEventListener('click', function (e) {
      var nav = e.target.closest('.app-nav');
      if (nav) {
        var topLi = e.target.closest('.app-nav > ul > li');
        var isSubMenuLink = e.target.closest('.app-nav li ul');
        if (topLi && !isSubMenuLink) {
          e.preventDefault();
          e.stopPropagation();
          topLi.classList.toggle('open');
          return;
        }
      }

      // Close dropdown when clicking outside
      var openLis = document.querySelectorAll('.app-nav li.open');
      openLis.forEach(function (li) {
        li.classList.remove('open');
      });
    });
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Light/Dark Mode Switcher JS -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@3/dist/index.min.js" type="text/javascript"></script>

  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- 3. Pagination Plugin Script -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <!-- 4. Docsify CLI Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-cli/dist/docsify-cli.min.js"></script>

  <!-- 5. Docsify Tabs Plugin Script -->
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>

  <!-- 6. Docsify Copy To Clipboard -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <!-- Prism.js Language Highlighters -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>

</body>

</html>
